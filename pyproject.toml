[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "videoxplainer"
version = "0.3.3"
description = "Turn YouTube videos into token-budgeted, evidence-checked action briefs for LLMs."
readme = "README.md"
license = "MIT"
authors = [{ name = "Narayan Govindaraj" }]
keywords = ["youtube", "transcript", "summary", "llm", "claude", "mcp", "token", "yt-dlp", "chapters"]
requires-python = ">=3.11"
dependencies = ["yt-dlp>=2025.1.1"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Topic :: Multimedia :: Video",
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
videoxplainer = "videoxplainer.cli:main"
vxp = "videoxplainer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/videoxplainer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.urls]
Homepage = "https://github.com/narayan-govindaraj/videoXplainer"
Issues = "https://github.com/narayan-govindaraj/videoXplainer/issues"
Changelog = "https://github.com/narayan-govindaraj/videoXplainer/blob/main/CHANGELOG.md"
